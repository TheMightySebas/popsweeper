<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4a8ad8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Popsweeper</title>
    <style>html,body{overscroll-behavior:none;background:#4a8ad8;height:100%;margin:0;overflow:hidden}canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:100%;height:100%;display:block;position:fixed;inset:0}@font-face{font-family:Fredoka UI;src:url(./assets/fredoka-ui-CNaQj-3o.woff2)format("woff2");font-weight:500 700;font-display:block}#boot{--u:min(1px, calc(100vw / 390), calc(100vh / 844));z-index:10;color:#fff;background:#2c7fc4 url(./assets/backdrop-OPMpCHv_.webp) 50%/cover no-repeat;font-family:Fredoka UI,system-ui,sans-serif;transition:opacity .32s cubic-bezier(.23,1,.32,1);position:fixed;inset:0;overflow:hidden}#boot.gone{opacity:0;pointer-events:none}#boot .stage{width:calc(var(--u) * 390);height:calc(var(--u) * 844);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#boot .stage>*{display:block;position:absolute}#boot .logo{left:calc(var(--u) * 45);top:calc(var(--u) * 92);width:calc(var(--u) * 300);height:calc(var(--u) * 237);transform:rotate(-3deg)}#boot .ride{left:calc(var(--u) * 115);top:calc(var(--u) * 326);width:calc(var(--u) * 160);height:calc(var(--u) * 290);animation:2.6s ease-in-out infinite alternate boot-bob}#boot .ride img{display:block;position:absolute}#boot .ride .b{left:0;top:calc(var(--u) * 126);width:calc(var(--u) * 160);height:calc(var(--u) * 160);transform:rotate(-6deg)}#boot .ride .s{left:calc(var(--u) * 2);width:calc(var(--u) * 150);height:calc(var(--u) * 150);top:0;transform:rotate(4deg)}#boot .track{left:calc(var(--u) * 45);top:calc(var(--u) * 716);width:calc(var(--u) * 300);height:calc(var(--u) * 26);background:#fff6facc;border-radius:14px 16px 15px 13px/15px 13px 16px 14px;box-shadow:inset 0 4px #3a1a481f,0 5px #3a1a4859}#boot .fill{background:#c92a6b;border-radius:10px;width:0;position:absolute;top:4px;bottom:4px;left:4px;box-shadow:inset 0 3px #ffffff59}#boot .tip{left:calc(var(--u) * 24);top:calc(var(--u) * 762);width:calc(var(--u) * 342);text-align:center;font-weight:600;font-size:max(13px, calc(var(--u) * 17));text-shadow:0 2px #3a1a48,2px 0 #3a1a48,-2px 0 #3a1a48,0 -2px #3a1a48,2px 2px #3a1a48,-2px 2px #3a1a48,2px -2px #3a1a48,-2px -2px #3a1a48,0 3px #3a1a48;margin:0;line-height:1.35}@keyframes boot-bob{0%{transform:translateY(0)}to{transform:translateY(calc(var(--u) * -10))}}@media (prefers-reduced-motion:reduce){#boot{transition:none}#boot .ride{animation:none}}</style>
    <script type="module" crossorigin src="./assets/index-C81x-ZfS.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/shop-UJyfe3PF.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DGomTsIF.css">
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="screen" aria-label="Popsweeper game board"></canvas>
    <div id="ui"></div>
    <div id="boot" role="status" aria-label="Loading">
      <div class="stage">
        <img class="logo" src="./assets/logo-wEuHbgy9.webp" alt="Popsweeper">
        <img src="./assets/bubble-DHj360--.webp" alt="" style="left: calc(var(--u) * 40); top: calc(var(--u) * 560); width: calc(var(--u) * 70); transform: rotate(-8deg)">
        <img src="./assets/float-BtU_pe12.webp" alt="" style="left: calc(var(--u) * 286); top: calc(var(--u) * 520); width: calc(var(--u) * 64); transform: rotate(14deg)">
        <img src="./assets/bubble-DHj360--.webp" alt="" style="left: calc(var(--u) * 300); top: calc(var(--u) * 404); width: calc(var(--u) * 40); opacity: 0.9">
        <img src="./assets/bubble-DHj360--.webp" alt="" style="left: calc(var(--u) * 64); top: calc(var(--u) * 420); width: calc(var(--u) * 32); opacity: 0.85">
        <img src="./assets/bubble-DHj360--.webp" alt="" style="left: calc(var(--u) * 110); top: calc(var(--u) * 640); width: calc(var(--u) * 26); opacity: 0.8">
        <img src="./assets/bubble-DHj360--.webp" alt="" style="left: calc(var(--u) * 262); top: calc(var(--u) * 620); width: calc(var(--u) * 22); opacity: 0.8">
        <div class="ride"><img class="b" src="./assets/bubble-DHj360--.webp" alt=""><img class="s" src="./assets/spirit-BKBn-yGk.webp" alt=""></div>
        <div class="track"><div class="fill"></div></div>
        <p class="tip">1 means it touches one bomb.</p>
      </div>
    </div>
  </body>
</html>
